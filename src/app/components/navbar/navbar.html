<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="PixelCraft Studio home">
      <span class="brand-mark">P</span>
      <span>pixelcraft<span class="brand-light">studio</span></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="menuOpen = !menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" [class.open]="menuOpen" aria-label="Main navigation">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
      <a class="nav-contact" routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">
        Let’s talk <span aria-hidden="true">↗</span>
      </a>
    </nav>
  </div>
</header>
